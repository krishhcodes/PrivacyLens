# Render blueprint: New > Blueprint > pick this repo. Free plan sleeps when idle and
# its disk is wiped on restart, so stored audits reset. Fine for a demo.
services:
  - type: web
    name: consentscope-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install fastapi uvicorn pydantic
    startCommand: HOST=0.0.0.0 sh run.sh
    healthCheckPath: /health
    envVars:
      - key: CONSENTSCOPE_ALLOWED_ORIGINS
        value: https://YOUR-WEBSITE.vercel.app   # the deployed website's address
      - key: PYTHON_VERSION
        value: 3.12.7
